<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgA" cx="10%" cy="6%" r="55%"><stop offset="0" stop-color="#3f7837" stop-opacity=".6"/><stop offset="1" stop-color="#3f7837" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgB" cx="88%" cy="90%" r="50%"><stop offset="0" stop-color="#4e3066" stop-opacity=".55"/><stop offset="1" stop-color="#4e3066" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane2" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
  </defs>
  <rect width="1200" height="660" fill="#0a0d0f"/>
  <rect width="1200" height="660" fill="url(#bgA)"/>
  <rect width="1200" height="660" fill="url(#bgB)"/>

  <rect x="14" y="14" width="740" height="588" rx="16" fill="url(#pane2)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="40" y="40" fill="#b6ff52" font-size="10" font-weight="800" letter-spacing="1.6">6 FREE MUSIC SOURCES</text>
  <text x="40" y="70" fill="#f2f5f3" font-size="26" font-weight="800">Discover music. Pay nothing.</text>
  <text x="40" y="92" fill="#96a19e" font-size="11">Six sources queried at the same time. Availability depends on each source.</text>

  <text x="40" y="118" fill="#c8d4cc" font-size="12" font-weight="800">Search the free streaming catalog</text>
  <rect x="40" y="130" width="520" height="42" rx="9" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="58" y="156" fill="#f6f8f6" font-size="13">new punjabi song 2026</text>
  <rect x="574" y="130" width="130" height="42" rx="9" fill="#b6ff52"/>
  <text x="594" y="156" fill="#192617" font-size="12" font-weight="800">Search music</text>

  <text x="40" y="200" fill="#c9d8cb" font-size="12" font-weight="800">Music source</text>
  <rect x="150" y="184" width="240" height="34" rx="9" fill="#0a0e0f" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="166" y="206" fill="#f2f6f3" font-size="13">All sources ▾</text>

  <g font-size="11" font-weight="800">
    <rect x="40" y="232" width="130" height="32" rx="8" fill="#b6ff52"/>
    <text x="56" y="252" fill="#172519">New releases</text>
    <rect x="180" y="232" width="140" height="32" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="196" y="252" fill="#d7e2d8">Popular &amp; radio</text>
  </g>

  <text x="40" y="292" fill="#b6ff52" font-size="11" font-weight="700">54 listings found · All free sources · Openverse unavailable</text>

  <g font-size="12" font-weight="800">
    <rect x="40" y="304" width="684" height="42" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#b6ff52" stroke-opacity=".22"/>
    <rect x="52" y="310" width="32" height="32" rx="6" fill="#225e60"/>
    <text x="96" y="320" fill="#f7f7f7">Roddy Theme (From &#8220;Jailer 2&#8221;)</text>
    <text x="96" y="332" fill="#94a09c" font-size="10" font-weight="400">Anirudh Ravichander</text>
    <text x="96" y="342" fill="#8fbf7a" font-size="9" font-weight="400">Apple Music · 30-sec preview · Apple ↗</text>
    <text x="520" y="326" fill="#85908b" font-size="9" font-weight="800">APPLE MUSIC</text>
    <text x="640" y="326" fill="#b6ff52" font-size="10">▶ ♥ ＋</text>

    <rect x="40" y="350" width="684" height="42" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="356" width="32" height="32" rx="6" fill="#314d2c"/>
    <text x="96" y="366" fill="#f7f7f7">Night Drive Tapes</text>
    <text x="96" y="378" fill="#94a09c" font-size="10" font-weight="400">Kassette</text>
    <text x="96" y="388" fill="#8fbf7a" font-size="9" font-weight="400">Audius · Artist-provided stream ↗</text>
    <text x="560" y="372" fill="#85908b" font-size="9" font-weight="800">AUDIUS</text>
    <text x="640" y="372" fill="#949c98" font-size="10">▶ ♥ ＋</text>

    <rect x="40" y="396" width="684" height="42" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="402" width="32" height="32" rx="6" fill="#84627a"/>
    <text x="96" y="412" fill="#f7f7f7">Synth Study No. 4</text>
    <text x="96" y="424" fill="#94a09c" font-size="10" font-weight="400">Open Lab Records</text>
    <text x="96" y="434" fill="#8fbf7a" font-size="9" font-weight="400">Openverse · CC BY-NC 4.0 ↗</text>
    <text x="540" y="418" fill="#85908b" font-size="9" font-weight="800">OPENVERSE</text>
    <text x="640" y="418" fill="#949c98" font-size="10">▶ ♥ ＋</text>

    <rect x="40" y="442" width="684" height="42" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="448" width="32" height="32" rx="6" fill="#4a3f2a"/>
    <text x="96" y="458" fill="#f7f7f7">Monsoon on a Tin Roof</text>
    <text x="96" y="470" fill="#94a09c" font-size="10" font-weight="400">Field Notes Archive</text>
    <text x="96" y="480" fill="#8fbf7a" font-size="9" font-weight="400">Wikimedia Commons · Public domain ↗</text>
    <text x="478" y="464" fill="#85908b" font-size="9" font-weight="800">WIKIMEDIA COMMONS</text>
    <text x="640" y="464" fill="#949c98" font-size="10">▶ ♥ ＋</text>

    <rect x="40" y="488" width="684" height="42" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="494" width="32" height="32" rx="6" fill="#2b3d51"/>
    <text x="96" y="504" fill="#f7f7f7">Radio Apna 24x7</text>
    <text x="96" y="516" fill="#94a09c" font-size="10" font-weight="400">Streaming now · no position to seek</text>
    <text x="96" y="526" fill="#8fbf7a" font-size="9" font-weight="400">Internet Radio · station's own terms ↗</text>
    <rect x="600" y="500" width="98" height="20" rx="5" fill="#b6ff52" fill-opacity=".18" stroke="#b6ff52" stroke-opacity=".3"/>
    <text x="612" y="514" fill="#d6ffa6" font-size="9" font-weight="800">LIVE RADIO</text>
  </g>

  <line x1="40" y1="546" x2="724" y2="546" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="40" y="566" fill="#94a29b" font-size="10">Every result keeps its own attribution and licence. OpenMic's MIT licence covers app code only — it never</text>
  <text x="40" y="582" fill="#94a29b" font-size="10">grants a right to copy, re-host or redistribute the recordings themselves.</text>

  <!-- fan-out diagram -->
  <rect x="774" y="14" width="412" height="588" rx="16" fill="url(#pane2)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="798" y="52" fill="#f2f5f3" font-size="16" font-weight="800">One search, six sources</text>
  <text x="798" y="72" fill="#96a19e" font-size="10">Promise-settled independently in src/providers.mjs</text>

  <rect x="880" y="92" width="200" height="36" rx="9" fill="#b6ff52"/>
  <text x="900" y="115" fill="#192617" font-size="12" font-weight="800">Free Music search</text>

  <g stroke="#ffffff" stroke-opacity=".28" fill="none">
    <path d="M980 128 V150 M822 150 H1147"/>
    <path d="M822 150 V172 M887 150 V172 M952 150 V172 M1017 150 V172 M1082 150 V172 M1147 150 V172"/>
  </g>

  <g font-weight="800">
    <rect x="792" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".55"/>
    <text x="797" y="194" fill="#dcffc8" font-size="10">Apple</text>
    <text x="797" y="214" fill="#94a09c" font-size="8.5" font-weight="400">newest +</text>
    <text x="797" y="227" fill="#94a09c" font-size="8.5" font-weight="400">30-sec clip</text>
    <rect x="797" y="240" width="46" height="12" rx="3" fill="#b6ff52" fill-opacity=".45"/>

    <rect x="857" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".35"/>
    <text x="862" y="194" fill="#dcffc8" font-size="10">Audius</text>
    <text x="862" y="214" fill="#94a09c" font-size="8.5" font-weight="400">latest +</text>
    <text x="862" y="227" fill="#94a09c" font-size="8.5" font-weight="400">trending</text>
    <rect x="862" y="240" width="38" height="12" rx="3" fill="#b6ff52" fill-opacity=".3"/>

    <rect x="922" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".35"/>
    <text x="927" y="194" fill="#dcffc8" font-size="9.5">Openverse</text>
    <text x="927" y="214" fill="#94a09c" font-size="8.5" font-weight="400">CC audio</text>
    <text x="927" y="227" fill="#94a09c" font-size="8.5" font-weight="400">+ licence</text>
    <rect x="927" y="240" width="34" height="12" rx="3" fill="#b6ff52" fill-opacity=".3"/>

    <rect x="987" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".35"/>
    <text x="992" y="194" fill="#dcffc8" font-size="10">Commons</text>
    <text x="992" y="214" fill="#94a09c" font-size="8.5" font-weight="400">open files</text>
    <text x="992" y="227" fill="#94a09c" font-size="8.5" font-weight="400">cleaned up</text>
    <rect x="992" y="240" width="30" height="12" rx="3" fill="#b6ff52" fill-opacity=".3"/>

    <rect x="1052" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ff8f8f" stroke-opacity=".5"/>
    <text x="1057" y="194" fill="#ffd0d0" font-size="10">Radio</text>
    <text x="1057" y="214" fill="#94a09c" font-size="8.5" font-weight="400">live radio</text>
    <text x="1057" y="227" fill="#94a09c" font-size="8.5" font-weight="400">backoff</text>
    <rect x="1057" y="240" width="16" height="12" rx="3" fill="#ff8f8f" fill-opacity=".4"/>

    <rect x="1117" y="172" width="60" height="88" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".7" stroke-dasharray="4 3"/>
    <text x="1122" y="194" fill="#dcffc8" font-size="10">YouTube</text>
    <text x="1122" y="214" fill="#94a09c" font-size="8.5" font-weight="400">full video</text>
    <text x="1122" y="227" fill="#94a09c" font-size="8.5" font-weight="400">needs key</text>
    <rect x="1122" y="240" width="26" height="12" rx="3" fill="#b6ff52" fill-opacity=".22"/>
  </g>

  <text x="798" y="292" fill="#f2f5f3" font-size="14" font-weight="800">What each source genuinely gives you</text>
  <g font-size="10" fill="#9facaa">
    <text x="798" y="314">Apple's chart feed labels a release date on every track, so New</text>
    <text x="798" y="328">releases is newest-first — commercial singles included, as Apple's</text>
    <text x="798" y="342">own 30-second preview served from Apple's own CDN.</text>
    <text x="798" y="366">Audius is a real chronological upload catalog, but only for the</text>
    <text x="798" y="380">independent artists who choose to publish there.</text>
    <text x="798" y="404">Openverse sorts by recently indexed, not released today; Commons</text>
    <text x="798" y="418">and Radio are directories, not release calendars.</text>
    <text x="798" y="442">A keyed server adds YouTube rows that play in-app.</text>
  </g>

  <rect x="792" y="458" width="376" height="140" rx="12" fill="#0e1811" fill-opacity=".5" stroke="#b6ff52" stroke-opacity=".24"/>
  <text x="812" y="484" fill="#b6ff52" font-size="11" font-weight="800">LIMITATIONS WE CLOSED</text>
  <g font-size="10" fill="#cfe0cb">
    <text x="812" y="505">· no newest-song answer — Apple chart feed added</text>
    <text x="812" y="520">· Openverse died after an API change — rebuilt on /v1/</text>
    <text x="812" y="535">· Commons served spoken word — audio filter added</text>
    <text x="812" y="550">· 429s gave silent empty pages — retry with backoff</text>
    <text x="812" y="565">· one slow source blanked the page — each settles alone</text>
    <text x="812" y="580">· 30-sec ceiling — Full track hands the rest to YouTube</text>
  </g>
  <text x="14" y="628" fill="#68716f" font-size="11">Free Music screen and the six-source fan-out, drawn from index.html, free-music.css, src/providers.mjs,</text>
  <text x="14" y="644" fill="#68716f" font-size="11">src/itunes.mjs, src/youtube.mjs and src/free-catalog.mjs. Labelled wireframe, not a capture.</text>
</svg>
