<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgC" cx="6%" cy="4%" r="50%"><stop offset="0" stop-color="#1c545e" stop-opacity=".6"/><stop offset="1" stop-color="#1c545e" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgD" cx="92%" cy="88%" r="52%"><stop offset="0" stop-color="#3f7837" stop-opacity=".55"/><stop offset="1" stop-color="#3f7837" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane3" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="rightsG" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#b6ff52" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
  </defs>
  <rect width="1200" height="720" fill="#0a0d0f"/>
  <rect width="1200" height="720" fill="url(#bgC)"/>
  <rect width="1200" height="720" fill="url(#bgD)"/>

  <rect x="14" y="14" width="760" height="652" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>

  <!-- head card -->
  <rect x="38" y="38" width="712" height="86" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="62" y="62" fill="#b6ff52" font-size="10" font-weight="800" letter-spacing="1.6">FOR ARTISTS</text>
  <text x="62" y="88" fill="#f2f5f3" font-size="20" font-weight="800">Your music. Your page.</text>
  <text x="62" y="108" fill="#c5d2c4" font-size="11">Signed in as @night-bus · 1 upload · 3.1 MB of 200 MB</text>
  <rect x="620" y="58" width="106" height="34" rx="9" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="640" y="80" fill="#f4f4f4" font-size="11" font-weight="800">Sign out</text>

  <!-- profile card -->
  <rect x="38" y="140" width="344" height="212" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="58" y="166" fill="#b6ff52" font-size="9" font-weight="800" letter-spacing="1.4">ARTIST PAGE</text>
  <text x="58" y="186" fill="#f2f5f3" font-size="15" font-weight="800">@night-bus</text>
  <text x="58" y="210" fill="#c8d4cc" font-size="10" font-weight="800">DISPLAY NAME</text>
  <rect x="58" y="218" width="300" height="30" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="70" y="238" fill="#f6f8f6" font-size="11">Night Bus</text>
  <text x="58" y="266" fill="#c8d4cc" font-size="10" font-weight="800">BIO</text>
  <rect x="58" y="274" width="300" height="42" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="70" y="292" fill="#f6f8f6" font-size="11">Solo recordings from a train window.</text>
  <text x="70" y="308" fill="#85908b" font-size="10">up to 500 characters</text>
  <rect x="58" y="324" width="112" height="26" rx="8" fill="#b6ff52"/>
  <text x="74" y="341" fill="#192617" font-size="11" font-weight="800">Save profile</text>

  <!-- upload card -->
  <rect x="406" y="140" width="344" height="330" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="426" y="172" fill="#f2f5f3" font-size="15" font-weight="800">Publish a recording</text>
  <rect x="426" y="184" width="300" height="34" rx="8" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08" stroke-dasharray="4 3"/>
  <text x="440" y="206" fill="#cfe0cb" font-size="11">last-train-home.wav  ·  3.1 MB</text>
  <rect x="426" y="226" width="300" height="28" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#b6ff52" stroke-opacity=".4"/>
  <text x="440" y="245" fill="#f6f8f6" font-size="11">Last Train Home</text>
  <rect x="426" y="260" width="146" height="28" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="440" y="279" fill="#85908b" font-size="11">genre: lofi</text>
  <rect x="580" y="260" width="146" height="28" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="594" y="279" fill="#85908b" font-size="11">tags: late-night, acoustic</text>

  <rect x="426" y="300" width="300" height="120" rx="10" fill="url(#rightsG)" stroke="#b6ff52" stroke-opacity=".3"/>
  <text x="442" y="324" fill="#b6ff52" font-size="10" font-weight="800">RIGHTS WARRANTY · openmic-rights-1</text>
  <rect x="442" y="334" width="12" height="12" rx="3" fill="#b6ff52" fill-opacity=".22" stroke="#b6ff52" stroke-opacity=".65"/>
  <path d="M445 340 l2.4 2.8 l4.6 -5.4" stroke="#b6ff52" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <text x="460" y="344" fill="#dcf3cf" font-size="9.5">I own this recording or hold a licence to publish</text>
  <text x="460" y="360" fill="#dcf3cf" font-size="9.5">it, it contains no sampled, ripped or re-uploaded</text>
  <text x="460" y="376" fill="#dcf3cf" font-size="9.5">material I am not cleared to distribute, and I accept</text>
  <text x="460" y="392" fill="#dcf3cf" font-size="9.5">that OpenMic removes infringing uploads and</text>
  <text x="460" y="408" fill="#dcf3cf" font-size="9.5">terminates repeat uploaders.</text>
  <rect x="426" y="432" width="300" height="30" rx="9" fill="#b6ff52"/>
  <text x="556" y="452" fill="#192617" font-size="12" font-weight="800">Publish</text>

  <!-- assistant card -->
  <rect x="38" y="366" width="344" height="218" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="58" y="394" fill="#f2f5f3" font-size="15" font-weight="800">Artist assistant</text>
  <rect x="58" y="404" width="304" height="26" rx="8" fill="#0a0e0f" fill-opacity=".6" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="70" y="422" fill="#f6f8f6" font-size="11">Check my rights situation ▾</text>
  <rect x="58" y="436" width="304" height="30" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="70" y="456" fill="#f6f8f6" font-size="11">a remix of a Bollywood song</text>
  <rect x="58" y="472" width="140" height="26" rx="8" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="70" y="490" fill="#f4f4f4" font-size="11" font-weight="800">Ask the assistant</text>
  <rect x="58" y="506" width="304" height="58" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="70" y="524" fill="#ffd0d0" font-size="10" font-weight="800">⚠ 2 rights flags before you publish</text>
  <text x="70" y="540" fill="#cfe0cb" font-size="10">· A remix needs the original owner's permission — usually</text>
  <text x="70" y="554" fill="#cfe0cb" font-size="10">  the label that holds the stems.</text>
  <text x="70" y="578" fill="#7f8b81" font-size="9">answered by local rules · no key, no network call</text>

  <!-- your uploads -->
  <rect x="406" y="486" width="344" height="98" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".08"/>
  <text x="426" y="512" fill="#f2f5f3" font-size="13" font-weight="800">Your uploads</text>
  <text x="580" y="512" fill="#94a09c" font-size="10">1 upload · 3.1 MB of 200 MB</text>
  <text x="426" y="536" fill="#f6f8f6" font-size="11">▶  Last Train Home</text>
  <text x="426" y="552" fill="#94a09c" font-size="10">Published · plays from this server</text>
  <text x="426" y="572" fill="#94a09c" font-size="10">Deleting your own upload is not a strike and does not denylist it.</text>

  <!-- right annotation -->
  <rect x="794" y="14" width="392" height="652" rx="16" fill="url(#pane3)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="818" y="52" fill="#f2f5f3" font-size="16" font-weight="800">What the server insists on</text>

  <g font-size="10" fill="#9facaa">
    <text x="818" y="80">Credentials</text>
    <text x="818" y="96">scrypt N=16384, per-user salt. Session cookie is</text>
    <text x="818" y="110">HttpOnly + SameSite=Lax; only its SHA-256 digest is stored,</text>
    <text x="818" y="124">so a leaked data file cannot revive a login.</text>

    <text x="818" y="154">Two-step upload</text>
    <text x="818" y="170">POST /api/tracks (metadata) → PUT /api/tracks/:id/audio</text>
    <text x="818" y="184">(raw bytes). Nothing is published until the audio lands;</text>
    <text x="818" y="198">a pending upload cannot be streamed.</text>

    <text x="818" y="228">Content is checked, not trusted</text>
    <text x="818" y="244">extension + magic bytes must agree · MIME allowlist</text>
    <text x="818" y="258">(mp3 m4a aac wav ogg opus flac webm) · 25 MB per file ·</text>
    <text x="818" y="272">200 MB and 60 tracks per profile · duplicate fingerprint</text>
    <text x="818" y="286">replays rejected.</text>

    <text x="818" y="316">Abuse limits</text>
    <text x="818" y="332">signup 10/hr · login 8 per 15 min · takedown 10/hr ·</text>
    <text x="818" y="346">assistant 60/min signed-in, 20/min anonymous.</text>
    <text x="818" y="360">Writes require the x-openmic-request marker (CSRF).</text>

    <text x="818" y="390">Playback</text>
    <text x="818" y="406">HTTP Range → 206 partial bodies, 416 on bad ranges,</text>
    <text x="818" y="420">immutable cache for audio. The stream URL is built in the</text>
    <text x="818" y="434">browser from the track id, so a response body can never</text>
    <text x="818" y="448">point the player at another host.</text>

    <text x="818" y="478">Storage</text>
    <text x="818" y="494">./data/db.json serialized tmp+rename, file 0600, dir 0700,</text>
    <text x="818" y="508">git-ignored. Email never leaves /api/session.</text>
  </g>

  <rect x="810" y="528" width="356" height="112" rx="12" fill="#0e1811" fill-opacity=".5" stroke="#b6ff52" stroke-opacity=".24"/>
  <text x="830" y="556" fill="#b6ff52" font-size="11" font-weight="800">THE PART THAT MAKES IT LEGAL</text>
  <text x="830" y="578" fill="#cfe0cb" font-size="10">A per-upload warranty plus notice-and-takedown plus</text>
  <text x="830" y="594" fill="#cfe0cb" font-size="10">fingerprint denylist plus two-strike termination. Without</text>
  <text x="830" y="610" fill="#cfe0cb" font-size="10">those four, hosting artist audio is just easy piracy with a</text>
  <text x="830" y="626" fill="#cfe0cb" font-size="10">nicer logo.</text>

  <text x="14" y="694" fill="#68716f" font-size="11">For artists screen, signed-in state (artist page → upload + warranty → assistant → your uploads), drawn from index.html,</text>
  <text x="14" y="710" fill="#68716f" font-size="11">src/artist.mjs and server/api.mjs. Labelled wireframe, not a pixel capture.</text>
</svg>
