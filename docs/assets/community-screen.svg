  <rect width="1200" height="700" fill="#0a0d0f"/>
  <rect width="1200" height="700" fill="url(#bgG)"/>
  <rect width="1200" height="700" fill="url(#bgH)"/>

  <rect x="14" y="14" width="700" height="612" rx="16" fill="url(#pane6)" stroke="#ffffff" stroke-opacity=".16"/>
  <text x="40" y="40" fill="#b6ff52" font-size="10" font-weight="800" letter-spacing="1.6">ARTIST-UPLOADED MUSIC</text>
  <text x="40" y="70" fill="#f2f5f3" font-size="26" font-weight="800">Community releases</text>
  <text x="40" y="92" fill="#96a19e" font-size="11">Recordings that artists published themselves on this OpenMic server, each with a rights warranty on file.</text>

  <text x="40" y="112" fill="#c8d4cc" font-size="10" font-weight="800">SEARCH ARTIST UPLOADS</text>
  <rect x="40" y="120" width="400" height="40" rx="9" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".1"/>
  <text x="58" y="145" fill="#85908b" font-size="12">Title, artist, handle or genre…</text>
  <rect x="452" y="118" width="228" height="34" rx="9" fill="#0a0e0f" fill-opacity=".55" stroke="#b6ff52" stroke-opacity=".4"/>
  <text x="452" y="112" fill="#c8d4cc" font-size="10" font-weight="800">Or describe the mood in plain words</text>
  <text x="466" y="140" fill="#f6f8f6" font-size="11">songs for a late night train ride</text>
  <rect x="452" y="160" width="150" height="30" rx="8" fill="#b6ff52"/>
  <text x="470" y="180" fill="#192617" font-size="11" font-weight="800">Ask the assistant</text>
  <text x="40" y="212" fill="#b6ff52" font-size="11" font-weight="700">Searching for: late night · train · focus · acoustic · lo-fi</text>

  <text x="40" y="228" fill="#f0f3f1" font-size="14" font-weight="800">12 upload(s) on this server · newest first</text>

  <g font-size="12" font-weight="800">
    <rect x="40" y="240" width="630" height="52" rx="10" fill="#ffffff" fill-opacity=".07" stroke="#b6ff52" stroke-opacity=".3"/>
    <rect x="52" y="249" width="34" height="34" rx="6" fill="#225e60"/>
    <text x="98" y="261" fill="#dcffc8">Last Train Home</text>
    <text x="98" y="276" fill="#94a09c" font-size="10" font-weight="400">Night Bus · indie</text>
    <text x="98" y="289" fill="#b6ff52" font-size="10" font-weight="400">@night-bus · rights warranty on file ↗</text>
    <text x="514" y="270" fill="#85908b" font-size="9" font-weight="800">ARTIST UPLOAD</text>
    <text x="606" y="272" fill="#b6ff52" font-size="12">▶ ♥ ＋</text><text x="652" y="272" fill="#ffcf7a" font-size="12">⚑</text>

    <rect x="40" y="298" width="630" height="52" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="307" width="34" height="34" rx="6" fill="#314d2c"/>
    <text x="98" y="319" fill="#f7f7f7">Kachcha Raasta</text>
    <text x="98" y="334" fill="#94a09c" font-size="10" font-weight="400">Tara Tapes · folk</text>
    <text x="98" y="347" fill="#b6ff52" font-size="10" font-weight="400">@tara-tapes · rights warranty on file ↗</text>
    <text x="514" y="328" fill="#85908b" font-size="9" font-weight="800">ARTIST UPLOAD</text>
    <text x="606" y="330" fill="#949c98" font-size="12">▶ ♥ ＋</text><text x="652" y="330" fill="#93a58f" font-size="12">⚑</text>

    <rect x="40" y="356" width="630" height="52" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="365" width="34" height="34" rx="6" fill="#84627a"/>
    <text x="98" y="377" fill="#f7f7f7">Third Rail Sessions</text>
    <text x="98" y="392" fill="#94a09c" font-size="10" font-weight="400">Third Rail · electronic</text>
    <text x="98" y="405" fill="#b6ff52" font-size="10" font-weight="400">@third-rail · rights warranty on file ↗</text>
    <text x="514" y="386" fill="#85908b" font-size="9" font-weight="800">ARTIST UPLOAD</text>
    <text x="606" y="388" fill="#949c98" font-size="12">▶ ♥ ＋</text><text x="652" y="388" fill="#ff8f8f" font-size="12">⚑</text>

    <rect x="40" y="414" width="630" height="52" rx="10" stroke="#ffffff" stroke-opacity=".06"/>
    <rect x="52" y="423" width="34" height="34" rx="6" fill="#2b3d51"/>
    <text x="98" y="435" fill="#f7f7f7">Monsoon On Tin</text>
    <text x="98" y="450" fill="#94a09c" font-size="10" font-weight="400">Field Notes · ambient</text>
    <text x="98" y="463" fill="#b6ff52" font-size="10" font-weight="400">@field-notes · rights warranty on file ↗</text>
    <text x="514" y="444" fill="#85908b" font-size="9" font-weight="800">ARTIST UPLOAD</text>
    <text x="606" y="446" fill="#949c98" font-size="12">▶ ♥ ＋</text><text x="652" y="446" fill="#93a58f" font-size="12">⚑</text>
  </g>

  <rect x="40" y="474" width="630" height="72" rx="12" fill="#0e1811" fill-opacity=".5" stroke="#b6ff52" stroke-opacity=".24"/>
  <text x="58" y="500" fill="#b6ff52" font-size="10" font-weight="800">BEHIND THIS SCREEN</text>
  <text x="58" y="520" fill="#cfe0cb" font-size="10">@ari-sound received a second valid notice on 21 Oct. Their remaining uploads were removed, their</text>
  <text x="58" y="536" fill="#cfe0cb" font-size="10">handle can no longer sign in, and both fingerprints are denylisted so the same files cannot come back.</text>

  <line x1="40" y1="566" x2="670" y2="566" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="40" y="590" fill="#94a29b" font-size="10">Spotted something that isn't the uploader's to publish? Flag any row, or file a notice at the bottom of this</text>
  <text x="40" y="606" fill="#94a29b" font-size="10">screen. Designated agent: the address in OPENMIC_DMCA_EMAIL. Counter-notices go to the same address.</text>

  <!-- takedown dialog -->
  <rect x="740" y="14" width="446" height="612" rx="18" fill="url(#modal6)" stroke="#ffffff" stroke-opacity=".18"/>
  <text x="766" y="52" fill="#b6ff52" font-size="10" font-weight="800" letter-spacing="1.6">TAKEDOWN DIALOG · #takedown-dialog</text>
  <text x="766" y="86" fill="#f4f5f3" font-size="22" font-weight="800">Report a recording</text>
  <text x="766" y="110" fill="#a9b6b1" font-size="11">Anonymous is fine. A vague notice is rejected — the</text>
  <text x="766" y="128" fill="#a9b6b1" font-size="11">law wants specifics, so the form asks for them.</text>

  <g font-size="10" font-weight="800" fill="#c8d4cc">
    <text x="766" y="164">THE WORK</text>
    <rect x="766" y="172" width="394" height="34" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="780" y="194" fill="#f6f8f6" font-size="11" font-weight="400">"Third Rail Sessions" — claimed by a label, not this artist</text>
    <text x="766" y="228">WHERE IT IS</text>
    <rect x="766" y="236" width="394" height="34" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="780" y="258" fill="#f6f8f6" font-size="11" font-weight="400">community:t-YWM5Iddg0qVv</text>
    <text x="766" y="292">YOUR CONTACT</text>
    <rect x="766" y="300" width="394" height="34" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="780" y="322" fill="#f6f8f6" font-size="11" font-weight="400">rights@example-label.com</text>
    <text x="766" y="356">DESCRIPTION OF THE NOTICE</text>
    <rect x="766" y="364" width="394" height="76" rx="8" fill="#0a0e0f" fill-opacity=".55" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="780" y="386" fill="#f6f8f6" font-size="11" font-weight="400">We hold the exclusive distribution rights to this</text>
    <text x="780" y="404" fill="#f6f8f6" font-size="11" font-weight="400">composition and recording; the uploader is not</text>
    <text x="780" y="422" fill="#f6f8f6" font-size="11" font-weight="400">licensed to publish it anywhere.</text>
  </g>

  <rect x="766" y="456" width="394" height="44" rx="10" fill="#ffffff" fill-opacity=".05" stroke="#b6ff52" stroke-opacity=".3"/>
  <text x="782" y="478" fill="#dcf3cf" font-size="11">☑ I state in good faith that this use is not authorised</text>
  <text x="798" y="494" fill="#85908b" font-size="10">by the rights owner, its agent, or the law</text>

  <rect x="766" y="514" width="176" height="38" rx="9" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="800" y="538" fill="#f4f4f4" font-size="12" font-weight="800">Cancel</text>
  <rect x="956" y="514" width="204" height="38" rx="9" fill="#e4574f"/>
  <text x="976" y="538" fill="#22100e" font-size="12" font-weight="800">Send notice</text>

  <text x="766" y="576" fill="#9facaa" font-size="10">Confirmation reads back what happened, including whether</text>
  <text x="766" y="592" fill="#9facaa" font-size="10">this was the uploader's second notice and their account ended.</text>

  <text x="14" y="654" fill="#68716f" font-size="11">Community screen and the notice form, drawn from index.html, src/artist.mjs, server/api.mjs (POST /api/takedown) and</text>
  <text x="14" y="670" fill="#68716f" font-size="11">rights-lifecycle.svg for the end-to-end flow. A labelled wireframe drawn from the DOM, not a capture of the running app.</text>
</svg>
