<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bgG" cx="12%" cy="90%" r="55%"><stop offset="0" stop-color="#4e3066" stop-opacity=".55"/><stop offset="1" stop-color="#4e3066" stop-opacity="0"/></radialGradient>
    <radialGradient id="bgH" cx="88%" cy="8%" r="50%"><stop offset="0" stop-color="#3f7837" stop-opacity=".5"/><stop offset="1" stop-color="#3f7837" stop-opacity="0"/></radialGradient>
    <linearGradient id="pane6" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".08"/><stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
    <linearGradient id="modal6" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/></linearGradient>
